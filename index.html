<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex">

  <title>Гардероб</title>
  <script>try{var t=localStorage.getItem('wardrobe-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=t;}catch(e){}try{var s=localStorage.getItem('wardrobe-style');document.documentElement.dataset.style=(s==='youtube'||s==='vk')?s:'pinterest';}catch(e){document.documentElement.dataset.style='pinterest';}</script>
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <header class="top">
    <div class="top-in">
      <h1 class="logo"><a href="./"><i>Г</i><b>Гардероб</b></a></h1>
      <label class="search" id="search" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
        <input class="find" id="q" type="search" placeholder="Найти вещь" aria-label="Поиск" autocomplete="off" spellcheck="false">
      </label>
      <div class="side"><div class="stylewrap"><button class="theme" id="style" type="button" aria-label="Стиль сайта" title="Стиль сайта" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.8-.8 1.8-1.7 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-.9.8-1.7 1.7-1.7H17a4 4 0 0 0 4-4C21 6.4 17 3 12 3z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7.5" r="1"/><circle cx="14.5" cy="7.5" r="1"/></svg></button><div class="menu" id="style-menu" role="menu" aria-label="Стиль сайта" hidden><p class="menu-h">Стиль сайта</p><button type="button" role="menuitemradio" data-pick="pinterest" aria-checked="true"><i class="ico ico-pin">P</i>Pinterest</button><button type="button" role="menuitemradio" data-pick="youtube" aria-checked="false"><i class="ico ico-yt"></i>YouTube</button><button type="button" role="menuitemradio" data-pick="vk" aria-checked="false"><i class="ico ico-vk">ВК</i>ВКонтакте 2010</button></div></div><button class="theme" id="theme" type="button" aria-label="Сменить тему" title="Светлая / тёмная тема"><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button><p class="count" id="count"></p><nav><a href="admin.html">Войти</a></nav></div>
    </div>
  </header>

  <nav class="guide" id="guide" aria-label="Плейлисты"></nav>

  <div class="wrap" id="wrap">
    <div class="crumb" id="crumb" hidden>
      <a class="back" href="#">Все персонажи</a>
      <span class="pl-cover" id="pl-cover" hidden><img id="pl-img" alt=""></span>
      <h2 id="cname"></h2>
      <p class="pl-meta" id="pl-meta"></p>
      <p class="cnote" id="cnote" hidden></p>
    </div>

    <section class="watch" id="watch" aria-label="Просмотр" hidden></section>

    <section class="spectrum" id="spectrum" aria-label="Цвета в гардеробе" hidden>
      <div class="bar" id="bar"></div>
      <p class="spectrum-note" id="spec-note"></p>
    </section>

    <section class="controls" id="controls" aria-label="Фильтры" hidden>
      <div class="tabs" id="tabs" role="group" aria-label="Категории"></div>
      <div class="row2">
        <div class="seasons" id="seasons" role="group" aria-label="Сезон"></div>
        <select class="sort" id="sort" aria-label="Порядок">
          <option value="new">Сначала новые</option>
          <option value="old">Сначала старые</option>
          <option value="name">По названию</option>
        </select>
        <button class="rnd" id="rnd" type="button" title="Случайная вещь">Что надеть?</button>
        <button class="reset" id="reset" type="button" hidden>Сбросить</button>
      </div>
    </section>

    <main>
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty" hidden></div>
    </main>

    <section class="wall" id="wall" aria-label="Стена" hidden></section>
  </div>

  <dialog id="modal" aria-label="Вещь">
    <form method="dialog"><button class="x" aria-label="Закрыть">×</button></form>
    <div id="modal-body"></div>
  </dialog>

  <script src="config.js?v=3"></script>
  <script src="wall.js?v=1"></script>
  <script src="app.js?v=7"></script>
  <script src="theme.js?v=6"></script>
</body>
</html>
