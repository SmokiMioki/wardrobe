  <div class="garden" aria-hidden="true">
    <i class="moon"></i>
    <svg class="lily a" viewBox="-110 -110 220 220"><use href="#lily"/></svg>
    <svg class="lily b" viewBox="-110 -110 220 220"><use href="#lily"/></svg>
    <svg class="lily c" viewBox="-110 -110 220 220"><use href="#lily"/></svg>

  <div class="wrap">
    <header class="top">
      <h1><a href="./">Гардероб</a></h1>
      <div class="side"><p class="count" id="count"></p><nav><a href="admin.html">Войти</a></nav></div>
    </header>

    <section class="spectrum" id="spectrum" aria-label="Цвета в гардеробе" hidden>
      <div class="bar" id="bar"></div>
      <p class="spectrum-note" id="spec-note"></p>
    </section>

    <section class="controls" id="controls" aria-label="Фильтры" hidden>
      <div class="tabs" id="tabs" role="group" aria-label="Категории"></div>
      <div class="row2">
        <div class="seasons" id="seasons" role="group" aria-label="Сезон"></div>
        <input class="find" id="q" type="search" placeholder="Найти вещь" aria-label="Поиск" autocomplete="off" spellcheck="false">
        <select class="sort" id="sort" aria-label="Порядок">
          <option value="new">Сначала новые</option>
          <option value="old">Сначала старые</option>
          <option value="name">По названию</option>
        </select>
        <button class="rnd" id="rnd" type="button" title="Случайная вещь">Что надеть?</button>
        <button class="reset" id="reset" type="button" hidden>Сбросить</button>
      </div>
    </section>

    <main>
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty" hidden></div>
    </main>
  </div>

  <dialog id="modal" aria-label="Вещь">
    <form method="dialog"><button class="x" aria-label="Закрыть">×</button></form>
    <div id="modal-body"></div>
  </dialog>

  <script src="config.js"></script>
  <script src="app.js"></script>
